<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2a"/>
      <stop offset="50%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- Subtle Inner Film Border / Canvas -->
  <rect x="7" y="7" width="50" height="50" rx="12" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-dasharray="3 3" stroke-width="1"/>

  <!-- Play Badge Polygon (Motion & Video) -->
  <path d="M22 17 L44 32 L22 47 Z" fill="url(#glowGrad)" opacity="0.22" filter="url(#softGlow)"/>

  <!-- Stylized Elegant Typography Letter "T" with motion cuts -->
  <g filter="url(#softGlow)">
    <!-- Top Horizontal Bar of "T" -->
    <path d="M16 21 C16 19.5 17.5 18 19.5 18 L44.5 18 C46.5 18 48 19.5 48 21 C48 22.5 46.5 24 44.5 24 L19.5 24 C17.5 24 16 22.5 16 21 Z" fill="url(#glowGrad)"/>
    
    <!-- Vertical Stem of "T" -->
    <path d="M28.5 24 L35.5 24 L35.5 44 C35.5 46.2 33.7 48 31.5 48 C29.3 48 28.5 46.2 28.5 44 Z" fill="url(#glowGrad)"/>
    
    <!-- White Highlight Overlay for 3D depth -->
    <path d="M20 19 L44 19 C44.5 19 45 19.5 45 20 C45 20.5 44.5 21 44 21 L20 21 C19.5 21 19 20.5 19 20 C19 19.5 19.5 19 20 19 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Kinetic Motion / Cinema Sparkle (Top Right) -->
  <path d="M48 11 Q48 16 53 16 Q48 16 48 21 Q48 16 43 16 Q48 16 48 11 Z" fill="url(#sparkGrad)"/>

  <!-- Small Ambient Sparkle (Bottom Left) -->
  <circle cx="16" cy="46" r="2" fill="#38bdf8" opacity="0.9"/>
</svg>
